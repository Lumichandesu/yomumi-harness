<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-labelledby="title desc">
<title id="title">One Windows fixture report was 41.7% smaller after compaction</title><desc id="desc">The original XML report was 880 bytes. Its compact JSON summary was 513 bytes. This is not a token measurement.</desc>
<rect x="1" y="1" width="718" height="198" rx="22" fill="#151729" stroke="#373951"/>
<g font-family="system-ui, Segoe UI, Arial, sans-serif">
<text x="24" y="39" font-size="25" fill="#f4f3fd" font-weight="700" text-anchor="start">880 B → 513 B on one fixture</text>
<text x="24" y="64" font-size="15" fill="#c5c7d9" font-weight="400" text-anchor="start">Original XML vs. compact JSON · not a token measurement</text>
<text x="24" y="104" font-size="16" fill="#f4f3fd" font-weight="400" text-anchor="start">JUnit XML</text>
<rect x="159" y="88" width="460" height="20" fill="#a1addc" rx="5"/>
<text x="632" y="105" font-size="16" fill="#f4f3fd" font-weight="400" text-anchor="start">880 B</text>
<text x="24" y="144" font-size="16" fill="#f4f3fd" font-weight="400" text-anchor="start">Summary JSON</text>
<rect x="159" y="128" width="268.15909090909093" height="20" fill="#ca9df9" rx="5"/>
<text x="441.15909090909093" y="145" font-size="16" fill="#f4f3fd" font-weight="400" text-anchor="start">513 B</text>
<text x="24" y="180" font-size="14" fill="#c5c7d9" font-weight="400" text-anchor="start">41.7% fewer bytes for this fixture. Paths and fingerprints still require review.</text>
</g></svg>
