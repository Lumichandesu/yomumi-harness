<title id="title">Rust versus Python: median Bun report processing time</title><desc id="desc">Measured on Linux. For compaction 30.644 versus 1.301 ms; comparison 32.114 versus 1.302 ms; 10,000-row expanded compaction 76.475 versus 12.732 ms.</desc>
