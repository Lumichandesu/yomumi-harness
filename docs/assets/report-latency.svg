<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img" aria-labelledby="title desc">
<title id="title">Bun report processing, Python versus Rust</title>
<desc id="desc">Median milliseconds: 30.644 versus 1.301 for compaction, 32.114 versus 1.302 for comparison, and 76.475 versus 12.732 for an expanded 10,000-row fixture. Lower is better.</desc>
<rect x="1" y="1" width="758" height="408" rx="22" fill="#151628" stroke="#303554"/>
<g font-family="system-ui,Segoe UI,sans-serif" fill="#f7f4ff">
<text x="30" y="42" font-size="23" font-weight="700">Bun report processing</text>
<text x="30" y="67" font-size="14" fill="#c5c4de">Linux x86-64 · 80 measured calls per engine · median ms · lower is better</text>
<rect x="32" y="86" width="14" height="14" rx="3" fill="#a7b4df"/><text x="54" y="98" font-size="14">Python reference</text>
<rect x="200" y="86" width="14" height="14" rx="3" fill="#ce9fff"/><text x="222" y="98" font-size="14">Rust release CLI</text>
<path d="M34 117V354" stroke="#3a3d58"/><text x="34" y="375" text-anchor="middle" font-size="12" fill="#c5c4de">0</text>
<path d="M194 117V354" stroke="#3a3d58"/><text x="194" y="375" text-anchor="middle" font-size="12" fill="#c5c4de">20</text>
<path d="M354 117V354" stroke="#3a3d58"/><text x="354" y="375" text-anchor="middle" font-size="12" fill="#c5c4de">40</text>
<path d="M514 117V354" stroke="#3a3d58"/><text x="514" y="375" text-anchor="middle" font-size="12" fill="#c5c4de">60</text>
<path d="M674 117V354" stroke="#3a3d58"/><text x="674" y="375" text-anchor="middle" font-size="12" fill="#c5c4de">80</text>
<text x="34" y="132" font-size="14" font-weight="600">Compact actual Bun report (2 tests)</text><rect x="34" y="141" width="245.152" height="13" fill="#a7b4df"/><text x="289.152" y="152" font-size="12">30.6</text><rect x="34" y="159" width="10.408" height="13" fill="#ce9fff"/><text x="54.408" y="170" font-size="12">1.3</text>
<text x="34" y="210" font-size="14" font-weight="600">Compare actual Bun reports (2 tests each)</text><rect x="34" y="219" width="256.912" height="13" fill="#a7b4df"/><text x="300.912" y="230" font-size="12">32.1</text><rect x="34" y="237" width="10.416" height="13" fill="#ce9fff"/><text x="54.416" y="248" font-size="12">1.3</text>
<text x="34" y="288" font-size="14" font-weight="600">Compact expanded fixture (10,000 rows)</text><rect x="34" y="297" width="611.8" height="13" fill="#a7b4df"/><text x="655.8" y="308" font-size="12">76.5</text><rect x="34" y="315" width="101.856" height="13" fill="#ce9fff"/><text x="145.856" y="326" font-size="12">12.7</text>
<text x="722" y="375" font-size="12" text-anchor="end" fill="#c5c4de">ms</text>
<text x="34" y="396" font-size="12" fill="#c5c4de">Includes process startup and file I/O. Excludes running Bun. Expanded rows are not executed tests.</text>
</g></svg>
